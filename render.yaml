services:
  - type: web
    name: archmind-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      # Set this in the Render dashboard after deploy -- never commit a real
      # API key to the repo. Chat features return a clear error until it's set.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: WORKSPACE_DIR
        value: ./data/workspaces
      - key: DATABASE_URL
        value: sqlite:///./data/archmind.db
      - key: MAX_UPLOAD_MB
        value: "200"
      # Set this to your Vercel deployment URL once the frontend is deployed,
      # e.g. https://archmind.vercel.app -- comma-separate multiple origins.
      - key: FRONTEND_ORIGIN
        sync: false
