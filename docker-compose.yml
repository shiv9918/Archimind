# ArchMind AI -- future upgrade path.
#
# Phase 1 (current) runs with zero external services: NetworkX for the
# knowledge graph, Qdrant in embedded/local mode, and SQLite -- nothing here
# needs to run for the app to work today.
#
# Once Docker is available, uncomment the services below and switch the
# corresponding GraphStore / database backend implementations (they were
# built behind interfaces specifically so this swap doesn't touch app code):
#   - Postgres  -> change DATABASE_URL in backend/.env
#   - Redis     -> wire up Celery for the Orchestrator instead of BackgroundTasks
#   - Neo4j     -> implement a Neo4jGraphStore(GraphStore) in
#                  backend/app/agents/knowledge_graph.py
#   - Qdrant    -> point QdrantClient at host="qdrant" instead of a local path

